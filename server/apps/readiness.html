<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Trust Readiness Assessment</title>
<style>
  :root {
    --orange: #F26E18;
    --orange-soft: #F8E5D9;
    --blue: #1F435F;
    --dark-blue: #192840;
    --surface: #FFFFFF;
    --bg: #F5F2F5;
    --ink-heading: #1F435F;
    --ink-body: #4B4B4B;
    --ink-muted: #8A8A92;
    --border: #E6E2E6;
    --series-actual: #2E6E9E;
    --series-goal: #E06414;
    --good: #0AA21C;
    --bad: #F01C1C;
    --grid-line: rgba(31, 67, 95, 0.055);
    --shadow: 0 1px 3px rgba(25, 40, 64, 0.08), 0 8px 24px rgba(25, 40, 64, 0.07);
    --font-heading: 'Abel', 'Avenir Next Condensed', 'Arial Narrow', var(--font-body);
    --font-body: 'Open Sans', -apple-system, 'Segoe UI', system-ui, Arial, sans-serif;
  }
  [data-theme="dark"] {
    --orange: #F47929;
    --orange-soft: rgba(244, 121, 41, 0.16);
    --surface: #1E334F;
    --bg: #192840;
    --ink-heading: #FFFFFF;
    --ink-body: #D6DDE6;
    --ink-muted: #8FA0B5;
    --border: rgba(255, 255, 255, 0.14);
    --series-actual: #4E90C6;
    --series-goal: #E06414;
    --grid-line: rgba(245, 242, 245, 0.045);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--font-body);
    color: var(--ink-body);
    font-size: 14px;
    line-height: 1.55;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 20px 20px 28px; }

  /* ---------- header ---------- */
  .hdr { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .hdr img { height: 26px; display: block; }
  .hdr .kicker {
    font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 0.14em;
    font-size: 11px; color: var(--ink-muted); white-space: nowrap;
  }
  .progress { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; margin-bottom: 22px; }
  .progress > div { height: 100%; border-radius: 2px; background: var(--orange); transition: width 0.35s ease; }

  /* ---------- generic ---------- */
  h1, h2, h3 {
    font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-heading); font-weight: 700; line-height: 1.2;
  }
  h1 { font-size: 26px; }
  h2 { font-size: 19px; }
  h3 { font-size: 13px; letter-spacing: 0.1em; }
  .muted { color: var(--ink-muted); }
  .card {
    position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 26px 28px; box-shadow: var(--shadow);
  }
  .card.brackets::before, .card.brackets::after {
    content: ''; position: absolute; width: 18px; height: 18px; pointer-events: none;
  }
  .card.brackets::before { top: 10px; left: 10px; border-top: 2px solid var(--orange); border-left: 2px solid var(--orange); }
  .card.brackets::after { bottom: 10px; right: 10px; border-bottom: 2px solid var(--orange); border-right: 2px solid var(--orange); }
  .screen { animation: enter 0.3s ease; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  button {
    font-family: var(--font-body); font-size: 14px; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-body);
    padding: 10px 18px; transition: all 0.15s ease;
  }
  button:hover { border-color: var(--orange); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--border); }
  .btn-primary {
    background: var(--orange); border-color: var(--orange); color: #fff;
    font-weight: 600; padding: 11px 26px;
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.07); }
  .btn-ghost { background: transparent; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 12px; }

  input[type="email"], input[type="number"], textarea {
    font-family: var(--font-body); font-size: 14px; color: var(--ink-body);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; width: 100%;
  }
  input:focus, textarea:focus { outline: 2px solid var(--orange); outline-offset: -1px; border-color: transparent; }
  label.fld { display: block; font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }

  .dim-chip {
    display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-heading);
    text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; font-weight: 700;
    color: var(--ink-heading); background: var(--orange-soft); border-radius: 999px; padding: 5px 13px;
  }
  .dim-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }

  /* ---------- welcome ---------- */
  .dims { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 22px 0; }
  .dims .d { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--bg); }
  .dims .d b { display: block; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-heading); font-size: 13px; margin-bottom: 4px; }
  .dims .d span { font-size: 12px; color: var(--ink-muted); }
  @media (max-width: 560px) { .dims { grid-template-columns: 1fr; } }

  /* ---------- question ---------- */
  .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .q-count { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .q-caption { margin-bottom: 10px; text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-weight: 700; font-size: 17px; }
  .q-expl { font-size: 13px; color: var(--ink-muted); margin-bottom: 6px; }
  details.guidance { margin: 8px 0 2px; font-size: 13px; }
  details.guidance summary { cursor: pointer; color: var(--series-actual); font-weight: 600; font-size: 12px; }
  details.guidance p { margin-top: 6px; color: var(--ink-muted); }

  .scale { margin-top: 18px; }
  .scale .lbl { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .scale .lbl .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .scale .lbl b { font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 0.1em; font-size: 12px; color: var(--ink-heading); }
  .pills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .pill {
    padding: 10px 0; text-align: center; font-weight: 700; font-size: 15px;
    border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .pill:hover { border-color: currentColor; }
  .pill.on-actual { background: var(--series-actual); border-color: var(--series-actual); color: #fff; }
  .pill.on-goal { background: var(--series-goal); border-color: var(--series-goal); color: #fff; }
  .scale .desc { min-height: 34px; font-size: 12.5px; color: var(--ink-muted); margin-top: 8px; }
  .scale .desc b { color: var(--ink-body); }

  details.comment { margin-top: 16px; }
  details.comment summary { cursor: pointer; font-size: 12px; color: var(--ink-muted); font-weight: 600; }
  details.comment textarea { margin-top: 8px; min-height: 60px; resize: vertical; }

  .kbd-hint { font-size: 11px; color: var(--ink-muted); }
  .kbd-hint kbd {
    font-family: var(--font-body); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; font-size: 10px;
  }

  /* ---------- scoping ---------- */
  .scope-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .scope-row input { width: 110px; text-align: center; font-size: 20px; font-weight: 700; }
  .stepper { width: 42px; height: 42px; font-size: 20px; line-height: 1; padding: 0; }
  .chips { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chips button { padding: 6px 14px; font-size: 13px; border-radius: 999px; }

  /* ---------- review ---------- */
  .rev-dim { margin-bottom: 18px; }
  .rev-dim h3 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .rev-dim h3 .avg { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--ink-muted); letter-spacing: 0; text-transform: none; }
  .rev-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: var(--surface); transition: border-color 0.15s;
  }
  .rev-row:hover { border-color: var(--orange); }
  .rev-row .cap { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { min-width: 26px; text-align: center; border-radius: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 0; color: #fff; font-variant-numeric: tabular-nums; }
  .tag.a { background: var(--series-actual); }
  .tag.g { background: var(--series-goal); }
  .gap { font-size: 11px; font-weight: 700; color: var(--ink-muted); min-width: 24px; text-align: right; font-variant-numeric: tabular-nums; }
  .gap.pos { color: var(--series-goal); }
  .warn-note { font-size: 12px; color: var(--ink-muted); margin-top: 14px; }

  /* ---------- results ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
  .stat { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--bg); }
  .stat .v { font-size: 22px; font-weight: 700; color: var(--ink-heading); font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-muted); }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .legend { display: flex; gap: 18px; justify-content: flex-end; font-size: 12px; color: var(--ink-muted); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .gap-list { margin-top: 18px; }
  .gap-item { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .gap-item .delta { font-weight: 700; color: var(--series-goal); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .next-step { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
  .ask-q {
    position: relative; margin-top: 8px; padding: 12px 84px 12px 14px; border: 1.5px dashed var(--orange);
    border-radius: 8px; background: var(--orange-soft); color: var(--ink-body); font-size: 13px; cursor: copy;
  }
  .ask-q:hover, .ask-q:focus-visible { border-style: solid; outline: none; }
  .copy-state {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%); user-select: none;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--orange);
  }
  .copy-state.ok { color: var(--good); }
  .done-hero { text-align: center; padding: 8px 0 18px; }
  .done-hero .check {
    width: 52px; height: 52px; border-radius: 50%; background: var(--good); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 12px;
  }
  .assess-id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-muted); }

  /* ---------- misc ---------- */
  .center { text-align: center; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--orange);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 30px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    background: rgba(240, 28, 28, 0.08); border: 1px solid rgba(240, 28, 28, 0.35);
    border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-top: 14px; color: var(--ink-body);
    overflow-wrap: anywhere;
  }
  .footer { margin-top: 18px; text-align: center; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 0.14em; font-size: 10px; color: var(--ink-muted); }
  .footer b { color: var(--orange); font-weight: 700; }
</style>
</head>

/* ================= JSON-RPC over postMessage ================= */
const rpc = { pending: new Map(), nextId: 1 };
function post(msg) { window.parent.postMessage(msg, '*'); }
function request(method, params) {
  return new Promise((resolve, reject) => {
    const id = rpc.nextId++;
    rpc.pending.set(id, { resolve, reject });
    post({ jsonrpc: '2.0', id, method, params });
  });
}
function notify(method, params) { post({ jsonrpc: '2.0', method, params }); }

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.jsonrpc !== '2.0') return;
  if (m.id !== undefined && (m.result !== undefined || m.error !== undefined)) {
    const p = rpc.pending.get(m.id);
    if (p) {
      rpc.pending.delete(m.id);
      m.error ? p.reject(m.error) : p.resolve(m.result);
    }
    return;
  }
  switch (m.method) {
    case 'ui/notifications/tool-result':
      onToolResult(m.params || {});
      break;
    case 'ui/notifications/host-context-changed':
      applyHostContext(m.params || {});
      break;
    case 'ui/resource-teardown':
      if (m.id !== undefined) post({ jsonrpc: '2.0', id: m.id, result: {} });
      break;
    case 'ui/notifications/tool-input':
    case 'ui/notifications/tool-input-partial':
    case 'ui/notifications/tool-cancelled':
      break;
    default:
      if (m.id !== undefined) post({ jsonrpc: '2.0', id: m.id, error: { code: -32601, message: 'method not found' } });
  }
});

function applyTheme(theme) {
  state.theme = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.style.colorScheme = state.theme;
  // The logo is an <img>, not CSS - swap it directly instead of re-rendering
  // so in-progress form input is never lost on a host theme change.
  const img = document.querySelector('.hdr img');
  if (img) img.src = logoSrc();
}
function applyHostContext(hc) {
  if (hc.theme) applyTheme(hc.theme);
  if (hc.styles && hc.styles.variables) {
    for (const [k, v] of Object.entries(hc.styles.variables)) {
      if (k === '--font-sans') document.documentElement.style.setProperty('--font-body', v);
    }
  }
}
function onToolResult(params) {
  if (state.questions) return;
  let q = params.structuredContent;
  if (!q && Array.isArray(params.content)) {
    const t = params.content.find((c) => c.type === 'text');
    if (t) { try { q = JSON.parse(t.text); } catch (_) { /* not JSON */ } }
  }
  if (q && q.version !== undefined) loadQuestions(q);
}
function loadQuestions(q) {
  state.questions = q;
  state.flat = [];
  for (const d of DIMS) for (const question of q[d.key] || []) state.flat.push({ dim: d.key, q: question });
  if (!state.flat.length) { showError('The questionnaire is empty.'); return; }
  state.screen = 'welcome';
  render();
}
function showError(msg) { state.screen = 'error'; state.error = String(msg); render(); }

async function init() {
  applyTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  render();
  if (window.parent === window) return; // standalone: wait for a harness or show loading
  try {
    const res = await request('ui/initialize', {
      appInfo: { name: 'auxo-readiness-assessment', version: '1.0.0' },
      appCapabilities: {},
      protocolVersion: '2026-01-26',
    });
    notify('ui/notifications/initialized', {});
    state.hosted = true;
    applyHostContext((res && res.hostContext) || {});
    // The triggering tool result normally delivers the questions; fetch them
    // ourselves if the notification hasn't arrived shortly after init.
    setTimeout(async () => {
      if (state.questions) return;
      try {
        const r = await request('tools/call', { name: 'getReadinessQuestions', arguments: {} });
        let q = r.structuredContent;
        if (!q) {
          const t = (r.content || []).find((c) => c.type === 'text');
          if (t) q = JSON.parse(t.text);
        }
        if (q && !state.questions) loadQuestions(q);
      } catch (err) {
        if (!state.questions) showError('Could not load the questionnaire: ' + (err.message || JSON.stringify(err)));
      }
    }, 2000);
  } catch (err) {
    showError('Initialization failed: ' + (err.message || JSON.stringify(err)));
  }
}

/* ================= size reporting ================= */
let lastH = 0;
new ResizeObserver(() => {
  if (!state.hosted) return;
  const h = Math.min(document.documentElement.scrollHeight, 1600);
  if (Math.abs(h - lastH) > 2) {
    lastH = h;
    notify('ui/notifications/size-changed', { width: document.documentElement.scrollWidth, height: h });
  }
}).observe(document.body);

/* ================= helpers ================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function answerLabel(q, level) {
  const a = q.answers || {};
  return a[level] || a[String(level)] || CMMI_FALLBACK[level] || '';
}
function dimLabel(key) { return DIMS.find((d) => d.key === key).label; }
function answeredCount() { return state.flat.filter((it) => complete(it.q.question_id)).length; }
function complete(qid) { const a = state.answers[qid]; return a && a.actual && a.goal; }
function avg(dimKey, field) {
  const vals = state.flat.filter((it) => it.dim === dimKey).map((it) => (state.answers[it.q.question_id] || {})[field] || 0);
  if (!vals.length) return 0;
  return vals.reduce((s, v) => s + v, 0) / vals.length;
}
function fmt1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
function progressPct() {
  const steps = state.flat.length + 1; // + scoping
  let done = answeredCount() + (state.scopeGoal ? 1 : 0);
  return Math.round((done / steps) * 100);
}
function logoSrc() { return state.theme === 'dark' ? LOGO_DARKBG : LOGO_LIGHTBG; }
function emailValid(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

/* ================= render ================= */
const app = document.getElementById('app');
function render() {
  const screens = {
    loading: rLoading, welcome: rWelcome, question: rQuestion, scoping: rScoping,
    review: rReview, submitting: rSubmitting, done: rDone, error: rError,
  };
  app.innerHTML = header() + '<div class="screen">' + screens[state.screen]() + '</div>' + footer();
  bind();
}
function header() {
  const showProgress = ['question', 'scoping', 'review'].includes(state.screen);
  return `
    <div class="hdr">
      <img src="${logoSrc()}" alt="ON2IT">
      <span class="kicker">Zero Trust Readiness</span>
    </div>
    ${showProgress ? `<div class="progress"><div style="width:${progressPct()}%"></div></div>` : ''}`;
}
function footer() {
  return `<div class="footer">ON2IT.NET <b>|</b> ZERO TRUST INNOVATORS</div>`;
}

function rLoading() {

}
function rError() {
  return `<div class="card brackets"><h2>Something went wrong</h2><div class="error-box">${esc(state.error)}</div>
    <div class="nav"><span></span><button data-act="retry" class="btn-primary">Try again</button></div></div>`;
}

    <div class="dims">
      ${DIMS.map((d) => `<div class="d"><b>${d.label}</b><span>${counts[d.key]} questions &mdash; ${d.blurb}</span></div>`).join('')}

  const explanation = sq ? sq.explanation
    : 'A protect surface is the smallest unit you protect: an application, data set, service or asset group.';

      <button class="stepper" data-act="scope-dec">&minus;</button>

      <button class="btn-ghost" data-act="back">&larr; Back</button>

function rReview() {
  const rows = (dimKey) => state.flat.map((it, i) => ({ it, i })).filter((x) => x.it.dim === dimKey).map(({ it, i }) => {
    const a = state.answers[it.q.question_id];

      <span class="cap">${esc(it.q.caption)}</span>
      <span class="tag a">${a.actual}</span><span class="tag g">${a.goal}</span>

  }).join('');

      <span style="color:var(--series-goal);font-weight:700">ambition</span></p>

      <div class="rev-dim">
        <h3>${d.label}<span class="avg">avg ${fmt1(avg(d.key, 'actual'))} &rarr; ${fmt1(avg(d.key, 'goal'))}</span></h3>

      </div>`).join('')}
    <div class="rev-dim">

function rSubmitting() {
  return `<div class="card center"><div class="spinner"></div><p class="muted">Submitting your assessment&hellip;</p></div>`;
}

function rDone() {
  const overallA = avg3('actual'), overallG = avg3('goal');
  const gaps = state.flat
    .map((it) => ({ it, gap: state.answers[it.q.question_id].goal - state.answers[it.q.question_id].actual }))
    .filter((x) => x.gap > 0).sort((a, b) => b.gap - a.gap).slice(0, 3);
  return `
  <div class="card brackets">
    <div class="done-hero">
      <div class="check">&#10003;</div>
      <h1>Assessment saved</h1>
      ${state.result && state.result.id ? `<div class="assess-id">ID ${esc(state.result.id)}</div>` : ''}
    </div>
    <div class="stats">
      <div class="stat"><div class="v">${fmt1(overallA)}</div><div class="l">Maturity today</div></div>
      <div class="stat"><div class="v">${fmt1(overallG)}</div><div class="l">Ambition</div></div>
      <div class="stat"><div class="v">${state.flat.length}</div><div class="l">Questions</div></div>
      <div class="stat"><div class="v">${state.scopeGoal}</div><div class="l">Protect surfaces</div></div>
    </div>
    <div class="legend"><span><i style="background:var(--series-actual)"></i>Today</span><span><i style="background:var(--series-goal)"></i>Ambition</span></div>
    ${dumbbellChart()}
    ${gaps.length ? `<div class="gap-list"><h3 style="margin-bottom:6px">Biggest ambition gaps</h3>
      ${gaps.map((x) => `<div class="gap-item"><span class="delta">+${x.gap}</span><span>${esc(x.it.q.caption)} <span class="muted">(${dimLabel(x.it.dim)})</span></span></div>`).join('')}
    </div>` : ''}
    <div class="next-step">
      <h3 style="margin-bottom:6px">Next step</h3>
      <p class="q-expl">The assessment is saved in the AUXO platform and shared with Claude.
      Ask for an analysis in the chat &mdash; click the question to copy it:</p>
      <div class="ask-q" id="ask-q" data-act="copy-question" role="button" tabindex="0" title="Click to copy">${esc(ADVISE_QUESTION)}<span class="copy-state" id="copy-state">copy</span></div>
    </div>
  </div>`;
}
function avg3(field) {
  const per = DIMS.map((d) => avg(d.key, field));
  return per.reduce((s, v) => s + v, 0) / per.length;
}

/* Dumbbell chart: per dimension, average today -> ambition on a 1-5 scale (SVG). */
function dumbbellChart() {
  const W = 640, rowH = 46, padL = 110, padR = 30, padT = 14, padB = 26;
  const H = padT + DIMS.length * rowH + padB;
  const x = (v) => padL + ((v - 1) / 4) * (W - padL - padR);
  const ticks = [1, 2, 3, 4, 5].map((t) => `
    <line x1="${x(t)}" y1="${padT}" x2="${x(t)}" y2="${H - padB}" stroke="var(--border)" stroke-width="1"/>
    <text x="${x(t)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--ink-muted)">${t}</text>`).join('');
  const rows = DIMS.map((d, i) => {
    const cy = padT + i * rowH + rowH / 2;
    const a = avg(d.key, 'actual'), g = avg(d.key, 'goal');
    const xa = x(a), xg = x(g);
    const labA = `<text x="${xa}" y="${cy - 13}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-body)">${fmt1(a)}</text>`;
    const labG = Math.abs(xg - xa) < 34
      ? `<text x="${xg}" y="${cy + 22}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-body)">${fmt1(g)}</text>`
      : `<text x="${xg}" y="${cy - 13}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-body)">${fmt1(g)}</text>`;
    return `
    <text x="${padL - 14}" y="${cy + 4}" text-anchor="end" font-size="12" fill="var(--ink-body)">${d.label}</text>
    <line x1="${xa}" y1="${cy}" x2="${xg}" y2="${cy}" stroke="var(--ink-muted)" stroke-width="2" opacity="0.5"/>
    <circle cx="${xa}" cy="${cy}" r="7" fill="var(--series-actual)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="${xg}" cy="${cy}" r="7" fill="var(--series-goal)" stroke="var(--surface)" stroke-width="2"/>
    ${labA}${xg !== xa ? labG : ''}`;
  }).join('');
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Average maturity today versus ambition per dimension">${ticks}${rows}</svg></div>`;
}

/* ================= events ================= */
function bind() {
  app.querySelectorAll('[data-set]').forEach((el) => el.addEventListener('click', () => {
    const it = state.flat[state.idx];
    const a = state.answers[it.q.question_id] || (state.answers[it.q.question_id] = {});
    a[el.dataset.set] = Number(el.dataset.n);
    saveComment();
    render();
  }));
  app.querySelectorAll('[data-act]').forEach((el) => el.addEventListener('click', () => act(el.dataset.act, el)));
  app.querySelectorAll('[data-goto]').forEach((el) => el.addEventListener('click', () => {
    state.idx = Number(el.dataset.goto); state.screen = 'question'; render();
  }));
  const email = app.querySelector('#email');
  if (email) email.addEventListener('input', () => {
    state.email = email.value.trim();
    const btn = app.querySelector('[data-act="start"],[data-act="submit"]');
    if (btn) btn.disabled = !emailValid(state.email);
  });
  const askQ = app.querySelector('#ask-q');
  if (askQ) askQ.addEventListener('keydown', (e) => { if (e.key === 'Enter') act('copy-question', askQ); });
  const scope = app.querySelector('#scope');
  if (scope) scope.addEventListener('input', () => {
    state.scopeGoal = Math.max(0, Math.floor(Number(scope.value))) || null;
    const btn = app.querySelector('[data-act="to-review"]');
    if (btn) btn.disabled = !(state.scopeGoal >= 1);
  });
}
function saveComment() {
  const c = app.querySelector('#comment');
  if (!c) return;
  const it = state.flat[state.idx];
  const a = state.answers[it.q.question_id] || (state.answers[it.q.question_id] = {});
  a.comment = c.value.trim();
}
function act(action, el) {
  switch (action) {
    case 'start': state.screen = 'question'; state.idx = 0; render(); break;
    case 'back':
      saveComment();
      if (state.screen === 'question' && state.idx > 0) { state.idx--; }
      else if (state.screen === 'question') { state.screen = 'welcome'; }
      else if (state.screen === 'scoping') { state.screen = 'question'; state.idx = state.flat.length - 1; }
      else if (state.screen === 'review') { state.screen = 'scoping'; }
      render(); break;
    case 'next':
      saveComment();
      if (state.idx < state.flat.length - 1) { state.idx++; } else { state.screen = 'scoping'; }
      render(); break;
    case 'to-scoping': state.screen = 'scoping'; render(); break;
    case 'to-review': state.screen = 'review'; render(); break;
    case 'scope-dec': state.scopeGoal = Math.max(1, (state.scopeGoal || 1) - 1); render(); break;
    case 'scope-inc': state.scopeGoal = (state.scopeGoal || 0) + 1; render(); break;
    case 'scope-set': state.scopeGoal = Number(el.dataset.n); render(); break;
    case 'submit': submit(); break;
    case 'retry': retry(); break;
    case 'copy-question': {
      const stateEl = app.querySelector('#copy-state');
      const done = () => { if (stateEl) { stateEl.textContent = 'copied ✓'; stateEl.classList.add('ok'); } };
      const fallback = () => {
        // Clipboard access can be blocked in the sandboxed iframe: select the
        // question text so a plain Cmd/Ctrl+C works.
        const textNode = el.firstChild;
        const range = document.createRange();
        range.setStart(textNode, 0);
        range.setEnd(textNode, textNode.textContent.length);
        const sel = getSelection();
        sel.removeAllRanges(); sel.addRange(range);
        if (stateEl) stateEl.textContent = 'press ' + (navigator.platform.startsWith('Mac') ? '⌘C' : 'Ctrl+C');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ADVISE_QUESTION).then(done).catch(fallback);
      } else { fallback(); }
      break;
    }
  }
}
function retry() {
  if (!state.questions) { state.screen = 'loading'; render(); init(); }
  else { state.screen = 'review'; render(); }
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (state.screen !== 'question') return;
  const it = state.flat[state.idx];
  if (e.key >= '1' && e.key <= '5') {
    const a = state.answers[it.q.question_id] || (state.answers[it.q.question_id] = {});
    if (!a.actual || (a.actual && a.goal)) { a.actual = Number(e.key); a.goal = undefined; }
    else { a.goal = Number(e.key); }
    saveComment(); render();
  } else if (e.key === 'Enter' && complete(it.q.question_id)) { act('next'); }
  else if (e.key === 'ArrowLeft') { act('back'); }
});

/* ================= submit ================= */
async function submit() {
  saveComment();
  state.screen = 'submitting'; render();
  const byDim = { strategical: [], tactical: [], operational: [] };
  for (const it of state.flat) {
    const a = state.answers[it.q.question_id];
    const ans = { question_id: it.q.question_id, actual: a.actual, goal: a.goal };
    if (a.comment) ans.comment = a.comment;
    byDim[it.dim].push(ans);
  }
  const args = {
    answered_by: state.email,
    strategical: byDim.strategical, tactical: byDim.tactical, operational: byDim.operational,
    scope_goal: state.scopeGoal, version: state.questions.version,
  };
  try {
    if (!state.hosted) throw new Error('Not connected to an MCP host (standalone preview).');
    const r = await request('tools/call', { name: 'createReadinessAssessment', arguments: args });
    const text = ((r.content || []).find((c) => c.type === 'text') || {}).text || '';
    if (r.isError) throw new Error(text || 'The server rejected the assessment.');
    let payload = r.structuredContent;
    if (!payload) { try { payload = JSON.parse(text); } catch (_) { payload = {}; } }
    state.result = payload;
    state.screen = 'done'; render();
    request('ui/update-model-context', { structuredContent: { readiness_assessment_submitted: payload } }).catch(() => {});
  } catch (err) {
    state.screen = 'review'; render();
    const box = document.createElement('div');
    box.className = 'error-box';
    box.textContent = 'Submission failed: ' + (err.message || JSON.stringify(err));
    const card = app.querySelector('.card');
    if (card) card.appendChild(box);
  }
}

   When opened directly in a browser (not iframed by an MCP host), a test
